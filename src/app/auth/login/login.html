
  <div class="container login-container" style="position: relative; z-index: 1000;">
    <div class="card shadow-sm" style="background: white;">
      <h3 class="text-center mb-4">Login</h3>
        <form [formGroup]="form">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="Enter email" required formControlName="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Password" formControlName="password" required>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <button type="submit" (click)="login()" class="btn btn-primary w-100" style="background-color: #0da2e7 !important; border: none !important; color: white !important; display: inline-block !important; visibility: visible !important; opacity: 1 !important;">Login</button>
        <p class="text-center mt-3">
          <a href="#">Forgot password?</a>
        </p>
      </form>
    </div>
  </div>
