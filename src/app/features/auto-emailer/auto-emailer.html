<section class="mail-wrap">
  <div class="page-head mb-3">
    <div>
      <h2 class="page-title"><i class="fa-regular fa-envelope me-2"></i>Auto Emailer</h2>
      <p class="text-muted mb-0 small">Automated email reminders are sent 30 days before each compliance due date</p>
    </div>
  </div>

  <div class="config-card">
    <h3 class="config-title"><i class="fa-regular fa-envelope me-2"></i>Auto Emailer Configuration</h3>

    <div class="config-row">
      <div class="left-side">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" role="switch" id="autoEmailSwitch" checked>
          <label class="form-check-label" for="autoEmailSwitch">Auto Email Reminders</label>
        </div>
      </div>

      <div class="middle-text">
        <i class="fa-regular fa-bell me-1"></i>
        Reminder triggers <b>30 days</b> before due date
      </div>

      <div class="status-text">
        Status:
        <span class="status-pill">Active</span>
      </div>
    </div>
  </div>

  <div class="mt-3 gap-1 d-flex">
    <button type="button" class="form-button">Sent Reminders</button>
    <button type="button" class="form-button">Pending Reminders</button>
    <button type="button" class="form-button">All</button>
  </div>

  <div class="config-card mt-3">
   <app-bootstrap-table
      [columns]="columns"
      [dataSource]="autoEmailer"
      [bodyTemplate]="bodyTemplate"
      [theme]="'common-blue'"
    >
    </app-bootstrap-table>
  </div>
</section>
