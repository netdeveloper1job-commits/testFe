<div class="eventLog-wrap">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-2">
    <div>
      <h2 class="page-title">Event Logs</h2>
      <p class="text-muted mb-0 small">View all event logs.</p>
    </div>
  </div>
    <div class="row mt-4">
      <app-bootstrap-table
  [columns]="columns"
  [dataSource]="allEventLogs"
  [bodyTemplate]="bodyTemplate"
  [theme]="'common-blue'"
>

<ng-template #bodyTemplate let-item="row" let-column="column">
  <ng-container *ngIf="column.dataField === 'eventDateTime'">
    {{ item?.eventDateTime | date:'dd/MM/yyyy | HH:mm:ss' }}
  </ng-container>
</ng-template>

</app-bootstrap-table>
  </div>
</div>
